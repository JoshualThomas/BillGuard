services:
  # FastAPI Server on Render
  - type: web
    name: billguard-backend
    env: python
    region: oregon
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: BillGuard API
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: DATABASE_URL
        fromDatabase:
          name: billguard-postgres
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: '["https://billguard.vercel.app","http://localhost:3000"]'

databases:
  # Managed PostgreSQL on Render
  - name: billguard-postgres
    databaseName: billguard
    user: billguard_admin
    region: oregon
    plan: free
